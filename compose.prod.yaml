# Production: docker compose -f compose.prod.yaml up -d --build   (xem docs/deploy.md)
# Mọi biến lấy từ .env (hoặc file chỉ định bằng APP_ENV_FILE).

x-app: &app
  image: ${APP_IMAGE:-nha-hang-app}:latest
  build:
    context: .
    dockerfile: docker/prod/Dockerfile
    target: app
    args:
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
  env_file: ${APP_ENV_FILE:-.env}
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  nginx:
    image: ${APP_IMAGE:-nha-hang-app}-nginx:latest
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: nginx
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
    environment:
      SERVER_NAME: ${SERVER_NAME:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - storage:/var/www/html/storage:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
      - reverb
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  app:
    <<: *app
    environment:
      CONTAINER_ROLE: app

  # Chờ app khởi động trước: volume storage trống được Docker chép dữ liệu từ image ở lần mount đầu,
  # nhiều container cùng mount một lúc sẽ lỗi "file exists".
  horizon:
    <<: *app
    depends_on: &after-app
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    depends_on: *after-app
    command: ["php", "artisan", "schedule:work"]

  reverb:
    <<: *app
    depends_on: *after-app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-512M}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # Gia hạn chứng chỉ Let's Encrypt (cấp lần đầu: make prod-ssl)
  certbot:
    image: certbot/certbot:latest
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    restart: unless-stopped
    logging: *logging

  # Sao lưu MySQL + ảnh upload mỗi ngày vào ./backups
  backup:
    image: mysql:8.4
    entrypoint: ["/bin/bash", "/usr/local/bin/backup.sh"]
    command: ["loop"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./docker/prod/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - storage:/storage:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  storage:
  mysql-data:
  redis-data:
  letsencrypt:
  certbot-www:
